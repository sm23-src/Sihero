<!DOCTYPE html>
<html>
<head>
    <title>Sihero</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; }
        #gas-iframe { width: 100%; height: 100vh; border: none; }
    </style>
</head>
<body>

    <iframe id="gas-iframe" src=""></iframe>

    <script>
        
        const urlParams = new URLSearchParams(window.location.search);
        const page = urlParams.get('page');
        
        
        const baseUrl = "https://script.google.com/macros/s/AKfycbzeQnaqXRfmwMz5JGA5wX9b5mUtbov_WMbgzQLx_7VvnUaObIx0mMc331x62e8Nl2Xo/exec";
        
        const iframe = document.getElementById('gas-iframe');
        if (page) {
            iframe.src = baseUrl + "?page=" + page;
        } else {
            iframe.src = baseUrl;
        }
    </script>

</body>
</html>
